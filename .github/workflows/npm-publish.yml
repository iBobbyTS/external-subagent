# npm release publish via Trusted Publishing (OIDC).
#
# Trusted publishing is configured per package on npmjs.com (package Settings
# → Trusted publishing → GitHub Actions) and requires this exact workflow
# filename, a GitHub-hosted runner, and no npm token in the environment:
# npm >= 11.5.1 exchanges the runner's OIDC identity automatically.  npm does
# not support trusted publishing for a package's FIRST release, so the
# initial version is published manually once, the trusted publisher is linked
# on npmjs.com (user iBobbyTS, repo external-subagent, workflow
# npm-publish.yml), and every later tag publishes from here.
#
# The runner must be Apple Silicon: the prepack lifecycle builds the
# darwin-arm64 native payload with cargo, and the pack checks verify the
# Mach-O arm64 binaries before anything is uploaded.  A tag push publishes;
# a manual workflow_dispatch run exercises the build and the full test gate
# without publishing, so the release chain can be verified between releases.
name: npm publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 30
    # The fresh-install tests run npm pack under an ISOLATED HOME, and the
    # rustup cargo shim resolves its default toolchain through $HOME/.rustup
    # — with HOME swapped, cargo fails with "no default is configured" unless
    # the toolchain is pinned by environment instead.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # A tag must publish exactly the version it names; a mismatch fails
      # before anything is built.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          fi

      # The release-only pipeline segments — npm pack/install/bin links, the
      # postinstall hook, first init on a fresh home, and the upgrade
      # reconcile — are exercised only by these suites.  They run against
      # packed tarballs in isolated prefixes and homes (the launchd and codex
      # seams are neutralized by test fixtures), so they need no external
      # subagent runtimes on the runner.  Publishing requires them green on
      # this exact commit and this exact build: everything below runs against
      # the binaries prepack will publish, closing the dev-machine/CI gap.
      - name: Run release-path test suites
        run: |
          npm run test:install
          node --test tests/cli/*.test.mjs tests/upgrade/*.test.mjs

      # prepack (cargo release build + payload manifest), the npm pack
      # checks (postpack), and the staged payload gate (prepublishOnly) all
      # run as package lifecycle scripts.  No NODE_AUTH_TOKEN is set: the
      # OIDC identity from id-token: write is the only credential.  Tag runs
      # publish; manual dispatch runs the build and tests only, so the whole
      # gate chain can be verified without burning a release.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --access public
