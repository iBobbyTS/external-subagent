# CI workflow for Windows compilation, platform contract verification, and the
# controlled win32-x64 payload/pack matrix (S03).
#
# windows-check (x64): cargo check on the MSVC host, the Node platform suites,
# a release build of the win32-x64 native payload, and `npm pack` (which runs
# the prepack builder and postpack payload/tarball gates).  The resulting
# tarball is uploaded as an artifact; it is a controlled test product and is
# NOT published (the three distribution gates stay closed until S04).
#
# windows-arm64-check: cargo check only, as required for the arm64 target while
# the x64 payload is the only controlled artifact.
name: Windows check

on:
  push:
    branches: ['**']
  pull_request: {}

permissions:
  contents: read

jobs:
  windows-check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Diagnostic - inspect installed rustup targets
        run: rustup target list --installed

      - name: Cargo check workspace
        run: cargo check --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Windows platform tests
        run: node --test tests/platform/windows.test.mjs tests/platform/windows-paths.test.mjs

      - name: Build controlled win32-x64 native payload
        run: node scripts/release/build-native-payload.mjs

      - name: Pack controlled win32-x64 artifact
        run: npm pack

      - name: Verify the packed artifact carries the win32-x64 payload
        shell: pwsh
        run: |
          $tgz = Get-ChildItem -Filter 'external-subagent-*.tgz' | Select-Object -First 1
          if (-not $tgz) { throw 'no packed tarball was produced' }
          Push-Location $tgz.DirectoryName
          $entries = tar -tzf $tgz.Name
          Pop-Location
          foreach ($entry in @(
            'package/npm/native/win32-x64/external-subagentd.exe',
            'package/npm/native/win32-x64/external-subagent-mcp.exe',
            'package/npm/native/win32-x64/payload.json'
          )) {
            if ($entries -notcontains $entry) { throw "missing packed entry: $entry" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: external-subagent-win32-x64
          path: external-subagent-*.tgz
          if-no-files-found: error

  windows-arm64-check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Add the aarch64 Windows target
        run: rustup target add aarch64-pc-windows-msvc

      - name: Cargo check win32-arm64
        run: cargo check --workspace --target aarch64-pc-windows-msvc
