[package]
name = "external-daemon"
version = "0.1.4"
edition = "2021"
license.workspace = true
autobins = false

[[bin]]
name = "external-subagentd"
path = "src/main.rs"

[dependencies]
external-runtime = { path = "../external-runtime" }
external-store = { path = "../external-store" }
external-core = { path = "../external-core" }
external-agent-codex = { path = "../subagents/codex" }
external-agent-dsh = { path = "../subagents/dsh" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
external-contract = { path = "../external-contract" }
signal-hook = "0.3"
libc = "0.2"
sha2 = "0.10"
socket2 = "0.6"
regex = "1"
tempfile = "3"
rmcp = { version = "=3.1.4", features = ["client", "server", "transport-io"] }
rmcp-macros = "=3.1.4"
schemars = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "net"] }

[dev-dependencies]
jsonschema = { version = "0.51", default-features = false }
rusqlite = "0.32"
